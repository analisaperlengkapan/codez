name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build frontend
        working-directory: crates/frontend
        run: trunk build --release

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: crates/frontend
        run: trunk build

      - name: Start servers
        run: |
          nohup cargo run -p backend > backend.log 2>&1 &
          (cd crates/frontend && nohup trunk serve > trunk.log 2>&1 &)

      - name: Wait for servers
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/ >/dev/null \
               && curl -sf http://127.0.0.1:8080/api/v1/repos >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "servers did not become ready" >&2
          cat backend.log crates/frontend/trunk.log 2>/dev/null || true
          exit 1

      - name: Run Playwright
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload server logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-logs
          path: |
            backend.log
            crates/frontend/trunk.log
          retention-days: 7
